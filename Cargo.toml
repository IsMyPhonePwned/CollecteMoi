[workspace]
resolver = "2"
members = [
    "crates/collectemoi-envelope",
    "crates/collectemoi-proto",
    "crates/collectemoi-db",
    "crates/collectemoi-api",
    "crates/collectemoi-cli",
    "crates/collectemoi-worker",
    "crates/collectemoi-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
authors = ["Anthony"]
repository = "https://github.com/ismyphonepwned/CollecteMoi"

[workspace.dependencies]
collectemoi-envelope = { path = "crates/collectemoi-envelope" }
collectemoi-proto = { path = "crates/collectemoi-proto" }
collectemoi-db = { path = "crates/collectemoi-db" }

anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hpke = { version = "0.12", default-features = false, features = ["std", "x25519"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
rand_core = "0.6"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
time = "0.3"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
serde_bytes = "0.11"
serde_json = "1"
url = "2"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
signature = "2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "limit", "cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
utoipa = { version = "5", features = ["uuid"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
